<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Propilot(y) | webová aplikace</title>
<meta name="description" content="Testovací webová verze aplikace Propilot(y): otázky s vysvětlením, zkouškový režim, historie testů a slabá místa.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0A1A30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0A1A30;--navy:#102648;--navy-700:#173766;--cobalt:#1A56DB;
  --sky:#CADBEA;--gold:#EDB458;--gold-200:#F6D79B;--earth:#B8742F;
  --bg:#EDF1F7;--surface:#fff;--line:#D7DFEA;--line-soft:#E7EDF5;
  --ink:#0E1B2E;--ink-2:#3C4B61;--ink-3:#6C7C93;--on-navy:#EAF1FA;--on-navy-muted:#A6B9D4;
  --ok:#16A34A;--ok-bg:#E7F6EC;--bad:#DC2626;--bad-bg:#FBEAEA;--warn:#D97706;
  --ff-d:"Space Grotesk",system-ui,sans-serif;--ff-b:"IBM Plex Sans",system-ui,sans-serif;--ff-m:"IBM Plex Mono",ui-monospace,monospace;
  --r:18px;--shadow:0 10px 30px -18px rgba(16,38,72,.35),0 2px 6px -2px rgba(16,38,72,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--ff-d);letter-spacing:-.01em;margin:0;line-height:1.15}
.mono{font-family:var(--ff-m)}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(10,26,48,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--on-navy);padding-top:env(safe-area-inset-top,0px)}
.top__in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding:.65rem clamp(14px,4vw,24px)}
.top__back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#fff}
.top__back svg{width:18px;height:18px}
.brand{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;color:#fff;font-family:var(--ff-d);font-weight:700;font-size:1.12rem;white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand b{color:var(--gold)}
.top__title{font-family:var(--ff-d);font-weight:600;font-size:1rem;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top__sp{flex:1}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:9px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--on-navy-muted);font-family:var(--ff-m);font-size:.72rem;padding:.42em .62em}
.lang button.on{background:var(--gold);color:var(--navy-900)}
.acct{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:var(--navy-700);color:#fff;font-family:var(--ff-d);font-weight:700;flex:none}
.beta-strip{background:var(--gold);color:var(--navy-900);text-align:center;font-family:var(--ff-m);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem .8rem}

/* ---------- layout ---------- */
.wrap{max-width:900px;margin:0 auto;padding:clamp(16px,3.5vw,28px) clamp(14px,4vw,24px) 110px}
.hero{background:radial-gradient(120% 90% at 85% -20%,rgba(26,86,219,.5),transparent 60%),linear-gradient(180deg,var(--navy-900),var(--navy));
  color:#fff;border-radius:24px;padding:clamp(22px,4vw,34px);display:flex;align-items:center;gap:1.2rem;box-shadow:var(--shadow)}
.hero svg.mk{width:64px;height:64px;flex:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.hero h1{font-size:clamp(1.5rem,3.6vw,2rem)}
.hero h1 b{color:var(--gold)}
.hero p{margin:.3rem 0 0;color:var(--on-navy-muted)}
.sec-h{font-family:var(--ff-m);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--earth);margin:1.8rem 0 .8rem}
.grid{display:grid;gap:14px}
@media(min-width:720px){.grid--2{grid-template-columns:1fr 1fr}}

/* tiles */
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:16px 16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 18px 36px -20px rgba(16,38,72,.45)}
.tile.is-off{opacity:.62;cursor:default}
.tile.is-off:hover{transform:none}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.ico svg{width:26px;height:26px}
.ico--sm{width:44px;height:44px;border-radius:12px}
.ico--sm svg{width:20px;height:20px}
.tile__t{flex:1;min-width:0}
.tile__t h3{font-size:1.08rem}
.tile__t p{margin:.15rem 0 0;color:var(--ink-3);font-size:.9rem}
.tile__r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.badge{font-size:.74rem;font-weight:600;color:#fff;padding:.22rem .6rem;border-radius:999px;white-space:nowrap}
.chev{width:16px;height:16px;color:#A9B6C8}
.soon{font-family:var(--ff-m);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--navy-900);padding:.2rem .5rem;border-radius:999px}

/* gradients */
.g-ppl{background:linear-gradient(135deg,#1A56DB,#102648)}.g-pplh{background:linear-gradient(135deg,#14B8A6,#0F766E)}
.g-bpl{background:linear-gradient(135deg,#22D3EE,#0E9AA7)}.g-spl{background:linear-gradient(135deg,#34D399,#16A34A)}
.g-radio{background:linear-gradient(135deg,#EDB458,#B8742F)}.g-laa{background:linear-gradient(135deg,#A855F7,#4F46E5)}
.g-rt{background:linear-gradient(135deg,#FB923C,#DC2626)}.g-hist{background:linear-gradient(135deg,#22C55E,#0D9488)}
.g-more{background:linear-gradient(135deg,#6366F1,#102648)}.g-book{background:linear-gradient(135deg,#F59E0B,#B45309)}
.g-exam{background:linear-gradient(135deg,#22C55E,#15803D)}.g-learn{background:linear-gradient(135deg,#1A56DB,#173766)}
.g-weak{background:linear-gradient(135deg,#F43F5E,#BE123C)}.g-ach{background:linear-gradient(135deg,#FACC15,#CA8A04)}
.g-set{background:linear-gradient(135deg,#64748B,#334155)}.g-mis{background:linear-gradient(135deg,#FB7185,#E11D48)}

/* streak */
.streak{display:flex;align-items:center;gap:16px;margin-top:14px;background:linear-gradient(120deg,#1A56DB,#173766);color:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
.ring>span{width:46px;height:46px;border-radius:50%;background:#173766;display:grid;place-items:center}
.ring svg{width:22px;height:22px;color:var(--gold)}
.streak h3{font-size:1.15rem}
.streak p{margin:.1rem 0 0;color:#C8D7EE;font-size:.9rem}

/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;
  text-decoration:none;color:var(--ink);width:100%;text-align:left}
.row:hover{border-color:var(--line)}
.row h4{margin:0;font-size:1rem;font-family:var(--ff-b);font-weight:600}
.row small{display:block;color:var(--ink-3);font-size:.84rem}
.row .r{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:.86rem;flex:none}
.pagehead{margin:.2rem 0 1.1rem}
.pagehead h1{font-size:clamp(1.5rem,3.5vw,2rem)}
.pagehead p{margin:.35rem 0 0;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--ff-d);font-size:1.5rem}
.stat span{font-size:.8rem;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:12px;padding:.8rem 1.2rem;font-weight:600;font-size:1rem;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn--gold{background:var(--gold);color:var(--navy-900);box-shadow:0 8px 20px -10px rgba(237,180,88,.9)}
.btn--gold:hover{background:var(--gold-200)}
.btn--navy{background:var(--navy);color:#fff}
.btn--navy:hover{background:var(--navy-700)}
.btn--ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn--ghost:hover{border-color:#B9C6D8}
.btn--danger{background:var(--bad-bg);color:var(--bad)}
.btn--block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--cobalt);font-weight:600;padding:0;font-size:.92rem}

/* mode cards */
.mode{display:block;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mode .tile{box-shadow:none;border:0;border-radius:0}
.mode__resume{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line-soft);padding:10px 16px;font-size:.88rem;color:var(--ink-2);background:#F7F9FC}
.mode__resume button{margin-left:auto}
.toggle{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer}
.toggle input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#CBD5E1;position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.toggle input:checked{background:var(--ok)}
.toggle input:checked::after{left:21px}
.toggle b{display:block}
.toggle small{color:var(--ink-3)}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qbar__prog{flex:1;height:8px;background:#DCE4EF;border-radius:999px;overflow:hidden}
.qbar__prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cobalt),#5B8DEF);border-radius:999px;transition:width .25s}
.qbar__n{font-family:var(--ff-m);font-size:.8rem;color:var(--ink-3);white-space:nowrap}
.timer{font-family:var(--ff-m);font-size:.85rem;background:var(--navy);color:#fff;border-radius:999px;padding:.25rem .7rem}
.timer.low{background:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:22px;box-shadow:var(--shadow);padding:clamp(18px,3.5vw,28px)}
.qcard__top{display:flex;align-items:flex-start;gap:12px}
.qcard__top .mono{font-size:.72rem;letter-spacing:.12em;color:var(--earth);text-transform:uppercase}
.qtext{font-size:clamp(1.05rem,2.2vw,1.2rem);font-weight:500;margin:.5rem 0 0;white-space:pre-line}
.bm{margin-left:auto;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3)}
.bm svg{width:20px;height:20px}
.bm.on{color:var(--earth);background:#FFF6E6;border-color:#F3D7A4}
.qimg{display:block;max-width:100%;max-height:340px;margin:16px auto 0;border-radius:12px;border:1px solid var(--line-soft);cursor:zoom-in}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#F7F9FC;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1rem;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:#9DB3D3;background:#fff}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-family:var(--ff-m);font-size:.8rem;color:var(--ink-2)}
.opt.sel{border-color:var(--cobalt);background:#EEF3FE}
.opt.sel .k{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.expl{margin-top:16px;border-radius:14px;padding:14px 16px;border-left:4px solid var(--ok);background:var(--ok-bg)}
.expl.bad{border-color:var(--bad);background:var(--bad-bg)}
.expl b{display:block;margin-bottom:.2rem}
.expl p{margin:0;color:var(--ink-2);white-space:pre-line}
.qnav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.qnav .btn{flex:1;min-width:130px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:var(--ff-m);font-size:.72rem;color:var(--ink-3)}
.dots button.a{background:#DCE7FB;border-color:#B4C9F2;color:var(--navy)}
.dots button.cur{outline:2px solid var(--gold);outline-offset:1px}
.qnavp{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:14px}
.qnavp__head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qnavp__head .linkbtn{display:inline-flex;align-items:center;gap:.4rem}
.qnavp__go{display:inline-flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-3);white-space:nowrap}
.qnavp__go input{width:84px;padding:.45rem .6rem}
.dots{max-height:240px;overflow-y:auto;padding:2px}
.dots button.r{background:var(--ok-bg);border-color:#9AD9B0;color:var(--ok)}
.dots button.w{background:var(--bad-bg);border-color:#F2B1B1;color:var(--bad)}
.qnavp__leg{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3);margin:.6rem 0 0}
.lg{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:#fff;display:inline-block;margin-left:.6rem}
.lg:first-child{margin-left:0}
.lg.r{background:var(--ok-bg);border-color:#9AD9B0}.lg.w{background:var(--bad-bg);border-color:#F2B1B1}
.hint{margin-top:10px;font-size:.78rem;color:var(--ink-3);text-align:center}
@media(hover:none){.hint{display:none}}

/* results */
.res{text-align:center}
.score{--p:0;--c:var(--ok);width:150px;height:150px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#E3E9F2 0)}
.score>div{width:124px;height:124px;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center}
.score b{font-family:var(--ff-d);font-size:2.2rem;line-height:1}
.score span{font-size:.8rem;color:var(--ink-3)}
.pill{display:inline-block;font-weight:600;font-size:.86rem;border-radius:999px;padding:.3rem .8rem}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.wrong{background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--bad);border-radius:14px;padding:14px 16px;text-align:left}
.wrong p{margin:.2rem 0}
.wrong .q{font-weight:600}
.wrong .y{color:var(--bad)}.wrong .c{color:var(--ok)}
.wrong .e{color:var(--ink-2);font-size:.92rem;white-space:pre-line}

/* achievements */
.ach{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px}
.ach.lock{opacity:.62}
.ach .ico{width:46px;height:46px;border-radius:50%}
.ach .ico svg{width:22px;height:22px}
.ach h4{margin:0;font-size:1rem}
.ach small{color:var(--ink-3)}
.bar{height:6px;background:#E3E9F2;border-radius:999px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}

/* auth */
.auth{max-width:440px;margin:clamp(20px,6vh,60px) auto 0}
.auth .card{padding:clamp(22px,4vw,32px)}
.auth__brand{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;margin-bottom:1.2rem}
.auth__brand svg{width:64px;height:64px}
.auth__brand h1{font-size:1.6rem}
.auth__brand h1 b{color:#D99A35}
.auth__brand p{margin:0;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:1rem}
.seg button{border:0;background:transparent;padding:.55rem;border-radius:9px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--ink-2);margin:.8rem 0 .3rem}
input.in,select.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem;font:inherit;background:#fff;color:var(--ink)}
input.in:focus,select.in:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.msg{font-size:.88rem;margin-top:.8rem;min-height:1.2em}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.or{display:flex;align-items:center;gap:.8rem;color:var(--ink-3);font-size:.8rem;margin:1.2rem 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:.82rem;color:var(--ink-3);text-align:center;margin-top:1rem}

.empty{text-align:center;padding:40px 16px;color:var(--ink-3)}
.empty svg{width:44px;height:44px;color:#A9B6C8}
.empty h3{color:var(--ink);margin:.6rem 0 .3rem}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;color:var(--ink-3)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #D5DEEA;border-top-color:var(--cobalt);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:.6rem 1rem;border-radius:12px;font-size:.9rem;z-index:60;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(6,16,32,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}

/* feedback floating button */
.fbk{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:inline-flex;align-items:center;gap:.5rem;
  background:var(--gold);color:var(--navy-900);font-weight:600;font-size:.9rem;padding:.7rem 1rem;border-radius:999px;text-decoration:none;box-shadow:0 12px 28px -10px rgba(10,26,48,.55)}
.fbk:hover{background:var(--gold-200)}
.fbk svg{width:18px;height:18px}
.fbk small{font-family:var(--ff-m);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
body.inquiz .fbk{display:none}
@media(max-width:560px){.brand span.w{display:none}.tile{padding:14px}.ico{width:50px;height:50px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pm" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" fill="#fff"/>

var DB={

function dayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayDiff(a,b){ var x=new Date(a+"T00:00:00"), y=new Date(b+"T00:00:00"); return Math.round((y-x)/86400000); }
function streakRoll(){
  var s=DB.streak(), t=dayKey();
  if(s.last && s.last!==t){ s.today=0; if(dayDiff(s.last,t)>=2) s.cur=0; lset("streak",s); }
  return s;
}
function streakRecord(n){
  var s=streakRoll(), t=dayKey();
  if(s.last!==t){ s.cur = (s.last && dayDiff(s.last,t)===1) ? s.cur+1 : 1; }
  s.best=Math.max(s.best||0,s.cur); s.today=(s.today||0)+n; s.last=t;
  lset("streak",s); cloudDataSoon();
}
function wrongRecord(qid,ok){ var w=DB.wrong(); if(ok) delete w[qid]; else w[qid]=(w[qid]||0)+1; lset("wrong",w); cloudDataSoon(); }

function loadIndex(){
  if(S.index) return Promise.resolve(S.index);
  var bases=["data/","","nahrat/data/","data/data/","nahrat/"], bi=0;
  function tryNext(){
    if(bi>=bases.length) return Promise.reject(new Error("index.json not found"));
    var base=bases[bi++];
    return fetch(base+"index.json",{cache:"no-cache"}).then(function(r){
      if(!r.ok) throw 0;
      return r.json().then(function(j){ if(!j||!j.groups) throw 0; DATA_BASE=base; return j; });
    }).catch(function(){ return tryNext(); });
  }
  return tryNext().then(function(j){
    S.index=j; S.catMap={}; S.licMap={};
    Object.keys(j.groups).forEach(function(g){ j.groups[g].forEach(function(L){ S.licMap[L.id]={g:g,meta:L}; L.cats.forEach(function(c){ S.catMap[c.id]={g:g,lic:L.id,meta:c,licTitle:L.title}; }); }); });
    return j;
  });
}
function loadGroup(g){
  if(S.groups[g]) return Promise.resolve(S.groups[g]);
  return fetch(DATA_BASE+g+".json").then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
    var lics={}, cats={}, qs={};
    j.licenses.forEach(function(L){ lics[L.id]=L; L.cats.forEach(function(c){ c.licId=L.id; c.licTitle=L.title; cats[c.id]=c; c.q.forEach(function(q){ q.cat=c.id; qs[q.i]=q; }); }); });
    S.groups[g]={lics:lics,cats:cats,qs:qs}; return S.groups[g];
  });
}
function groupOfCat(cat){ var m=S.catMap[cat]; return m? m.g : null; }
function loadCats(catIds){
  var gs={}; catIds.forEach(function(c){ var g=groupOfCat(c); if(g) gs[g]=1; });
  return Promise.all(Object.keys(gs).map(loadGroup));
}
function findQ(qid){ for(var g in S.groups){ var q=S.groups[g].qs[qid]; if(q) return q; } return null; }
function lp(){ return S.lang==="en" ? "en-" : "cs-"; }
function licCount(ids){ var n=0; ids.forEach(function(id){ var L=S.licMap[id]; if(L) L.meta.cats.forEach(function(c){ n+=c.n; }); }); return n; }

function route(){

  if(!S.user){ return viewAuth(); }
  if(parts[0]!=="quiz" && S.quiz && !S.quiz.finished){ saveQuizProgress(); S.quiz=null; stopTimer(); }
  loading();
  loadIndex().then(function(){
    switch(parts[0]){
      case "": case "home": return viewHome();
      case "pilot": return viewPick("pilot");
      case "bpl": return viewPick("bpl");
      case "radio": return viewPick("radio");
      case "laa": return viewLAA();
      case "lic": return viewLicense(parts[1]);
      case "cat": return viewCat(parts[1]);
      case "quiz": return viewQuiz(parts[1],parts[2],parts[3]);
      case "result": return viewResult();

  }).catch(function(e){ console.error(e); failed(); });
}

  function draw(){
    render('<div class="auth"><div class="card">'+

      '<label class="f" for="aP">'+esc(T("a_pass"))+'</label><input class="in" id="aP" type="password" autocomplete="'+(mode==="in"?"current-password":"new-password")+'">'+
      (mode==="up"?'<label class="f" for="aP2">'+esc(T("a_pass2"))+'</label><input class="in" id="aP2" type="password" autocomplete="new-password">':'')+
      '<div class="msg" id="aM" aria-live="polite"></div>'+
      '<button class="btn btn--gold btn--block" id="aGo" style="margin-top:.6rem">'+esc(mode==="in"?T("a_btn_in"):T("a_btn_up"))+'</button>'+
      (mode==="in"?'<p style="text-align:center;margin:.9rem 0 0"><button class="linkbtn" id="aF">'+esc(T("a_forgot"))+'</button></p>':'')+
      '<p class="note">'+esc(T("a_note"))+'</p></div></div>');
    V.querySelectorAll(".seg button").forEach(function(b){ b.onclick=function(){ mode=b.getAttribute("data-m"); draw(); }; });
    var M=document.getElementById("aM");
    function say(t,ok){ M.textContent=t; M.className="msg "+(ok?"ok":"err"); }
    if(!sb) say(T("a_offline"),false);
    var go_=document.getElementById("aGo");
    function submit(){
      var e=document.getElementById("aE").value.trim(), p=document.getElementById("aP").value;
      if(!sb){ say(T("a_offline"),false); return; }
      if(!e||!p){ say(T("a_fill"),false); return; }
      if(mode==="up"){
        if(p.length<6){ say(T("a_short"),false); return; }
        if(p!==document.getElementById("aP2").value){ say(T("a_mismatch"),false); return; }
      }
      go_.disabled=true;
      var pr = mode==="in" ? sb.auth.signInWithPassword({email:e,password:p})
        : sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
      pr.then(function(r){
        go_.disabled=false;
        if(r.error){ var m=(r.error.message||"").toLowerCase(); say(m.indexOf("confirm")>=0?T("a_unconf"):(mode==="in"?T("a_bad"):r.error.message),false); return; }
        if(mode==="up" && !r.data.session){ say(T("a_confirm"),true); return; }
      },function(){ go_.disabled=false; say(T("a_offline"),false); });
    }
    go_.onclick=submit;
    V.querySelectorAll("input").forEach(function(i){ i.addEventListener("keydown",function(ev){ if(ev.key==="Enter") submit(); }); });
    var f=document.getElementById("aF");
    if(f) f.onclick=function(){
      var e=document.getElementById("aE").value.trim(); if(!e){ say(T("a_email_first"),false); return; }
      if(!sb){ say(T("a_offline"),false); return; }
      sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(function(r){ if(r.error) say(r.error.message,false); else say(T("a_reset_sent"),true); });
    };
  }
  draw();
}

/* ================= QUIZ ================= */
var timerId=null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function mkShuffled(q){ var order=shuffle(q.o.map(function(_,i){ return i; })); return { q:q, order:order, correct:order.indexOf(q.c) }; }

function viewQuiz(catId,mode,extra){
  mode = mode==="exam" ? "exam" : "learning";
  var adhoc = catId==="__mistakes" || catId==="__bookmarks";
  if(S.quiz && S.quiz.catId===catId && S.quiz.mode===mode && !S.quiz.finished) return drawQuiz();
  if(adhoc){
    var ids = catId==="__mistakes" ? mistakeIds() : Object.keys(DB.bookmarks());
    var cats = catId==="__mistakes" ? DB.attempts().map(function(a){ return a.categoryId; }) : ids.map(function(i){ return DB.bookmarks()[i]; });
    return loadCats(cats).then(function(){
      var qs=ids.map(findQ).filter(Boolean); if(!qs.length) return go("#/");
      startQuiz({ catId:catId, mode:"learning", title: catId==="__mistakes"?T("mis_title"):T("bm_title"), licTitle:"", list:weighted(qs), adhoc:true });
    });
  }
  var m=S.catMap[catId]; if(!m) return go("#/");
  loadGroup(m.g).then(function(G){
    var c=G.cats[catId];
    return progressLoad(catId,mode).then(function(saved){
      var list;
      if(saved && saved.ids && saved.ids.length){
        list=saved.ids.map(function(id){ return G.qs[id]; }).filter(Boolean);
      }
      var resumed = !!(list && list.length);
      if(!resumed){ var w=weighted(c.q); list = mode==="exam" ? w.slice(0,Math.min(c.exam,w.length)) : w; }
      var timer=false; try{ timer = mode==="exam" && localStorage.getItem("pp_timer")==="1"; }catch(e){}
      startQuiz({ catId:catId, mode:mode, title:c.title, licTitle:c.licTitle, list:list, timer:timer,
        index: resumed ? Math.min(saved.index, list.length-1) : 0, answers: resumed && saved.answers ? saved.answers : {} });
    });
  }).catch(function(e){ console.error(e); failed(); });
}
function startQuiz(o){
  stopTimer();
  /* answers are stored per question index as the ORIGINAL option index, so they survive reshuffling on resume */
  var Q={ catId:o.catId, mode:o.mode, title:o.title, licTitle:o.licTitle, adhoc:!!o.adhoc,
    items:o.list.map(mkShuffled), i:o.index||0, answers:o.answers||{}, finished:false, remaining:null, nav:false };
  if(Q.mode==="exam" && o.timer){ Q.remaining=Math.max(60,Q.items.length*60); }
  S.quiz=Q;
  if(!Q.adhoc) saveQuizProgress();
  if(Q.remaining!=null){
    timerId=setInterval(function(){
      if(!S.quiz||S.quiz!==Q||Q.finished){ stopTimer(); return; }
      Q.remaining--; var el=document.getElementById("tmrv");
      if(el){ el.textContent=mmss(Q.remaining); el.parentNode.classList.toggle("low",Q.remaining<=60); }
      if(Q.remaining<=0){ stopTimer(); submitExam(); }
    },1000);
  }
  drawQuiz();
}
function mmss(s){ s=Math.max(0,s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function selOf(Q,idx){ var a=Q.answers[idx]; return a===undefined? undefined : Q.items[idx].order.indexOf(a); }
function isRight(Q,idx){ var a=Q.answers[idx]; return a!==undefined && a===Q.items[idx].q.c; }
function answeredCount(Q){ return Object.keys(Q.answers).length; }
function correctCount(Q){ var n=0; for(var k in Q.answers) if(isRight(Q,+k)) n++; return n; }
function saveQuizProgress(){
  var Q=S.quiz; if(!Q||Q.adhoc||Q.finished) return;
  progressSave({ catId:Q.catId, mode:Q.mode, index:Q.i, ids:Q.items.map(function(x){ return x.q.i; }),
    correct: Q.mode==="learning" ? correctCount(Q) : 0, answers: Q.answers });
}
function goTo(idx){
  var Q=S.quiz; if(!Q) return;
  idx=Math.max(0,Math.min(Q.items.length-1,idx)); if(idx===Q.i) return;
  Q.i=idx; saveQuizProgress(); drawQuiz(); window.scrollTo(0,0);
}
function drawNav(Q){
  var n=Q.items.length, h='<div class="qnavp"><div class="qnavp__head"><button class="linkbtn" id="navTog">'+ic("grid").replace('<svg','<svg width="16" height="16"')+' '+esc(T("nav_all"))+' ('+answeredCount(Q)+' / '+n+')</button>'+
    '<span class="qnavp__go"><label for="goN">'+esc(T("nav_go"))+'</label><input class="in" id="goN" type="number" min="1" max="'+n+'" inputmode="numeric" placeholder="'+(Q.i+1)+'"></span></div>';
  if(Q.nav || Q.mode==="exam"){
    h+='<div class="dots">';
    for(var d=0;d<n;d++){
      var cls="";
      if(Q.answers[d]!==undefined) cls = Q.mode==="learning" ? (isRight(Q,d)?"r":"w") : "a";
      h+='<button data-d="'+d+'" class="'+cls+(d===Q.i?' cur':'')+'">'+(d+1)+'</button>';
    }
    h+='</div>';
    if(Q.mode==="learning") h+='<p class="qnavp__leg"><span class="lg r"></span>'+esc(T("correct"))+'<span class="lg w"></span>'+esc(T("wrong"))+'<span class="lg"></span>'+esc(T("nav_open"))+'</p>';
  }
  return h+'</div>';
}
function drawQuiz(){
  var Q=S.quiz; if(!Q) return go("#/");
  setTop(Q.title,true);
  var it=Q.items[Q.i], q=it.q, n=Q.items.length, letters="ABCDEF";
  var sel=selOf(Q,Q.i), revealed = Q.mode==="learning" && sel!==undefined;
  var answered=answeredCount(Q);
  var bm=DB.bookmarks()[q.i]!==undefined;
  var html='<div class="qbar"><div class="qbar__prog"><i style="width:'+Math.round(answered/n*100)+'%"></i></div><span class="qbar__n">'+T("qof")(Q.i+1,n)+'</span>'+
    (Q.remaining!=null?'<span class="timer'+(Q.remaining<=60?' low':'')+'"><span id="tmrv">'+mmss(Q.remaining)+'</span></span>':'')+'</div>'+
    '<div class="qcard"><div class="qcard__top"><div><span class="mono">'+esc(T("question"))+' '+(Q.i+1)+'</span><p class="qtext">'+esc(q.t)+'</p></div>'+
    '<button class="bm'+(bm?' on':'')+'" id="bmBtn" aria-label="'+esc(T("bm"))+'">'+ic(bm?"bmf":"bm")+'</button></div>'+
    (q.m?'<img class="qimg" src="'+DATA_BASE+'img/'+encodeURIComponent(q.m)+'" alt="" loading="lazy" id="qimg">':'')+
    '<div class="opts">';
  it.order.forEach(function(oi,k){
    var cls="";
    if(revealed){ if(k===it.correct) cls="ok"; else if(k===sel) cls="bad"; }
    else if(k===sel) cls="sel";
    html+='<button class="opt '+cls+'" data-k="'+k+'"'+(revealed?' disabled':'')+'><span class="k">'+letters[k]+'</span><span>'+esc(q.o[oi])+'</span></button>';
  });
  html+='</div>';
  if(revealed){
    var ok=sel===it.correct;
    html+='<div class="expl'+(ok?'':' bad')+'"><b>'+esc(ok?T("correct"):T("wrong")+" · "+T("expl"))+'</b>'+(q.e?'<p>'+esc(q.e)+'</p>':'')+'</div>';
  }
  html+='<div class="qnav"><button class="btn btn--ghost" id="prevBtn"'+(Q.i===0?' disabled':'')+'>'+esc(T("prev"))+'</button>';
  if(Q.mode==="learning"){
    if(Q.i+1<n) html+='<button class="btn '+(revealed?'btn--gold':'btn--navy')+'" id="nextBtn">'+esc(revealed?T("next"):T("skip"))+'</button>';
    html+='<button class="btn '+(Q.i+1>=n&&revealed?'btn--gold':'btn--ghost')+'" id="finBtn"'+(answered?'':' disabled')+'>'+esc(T("finish"))+'</button>';
  } else {
    if(Q.i+1<n) html+='<button class="btn btn--navy" id="nextBtn">'+esc(T("nextq"))+'</button>';
    html+='<button class="btn btn--gold" id="subBtn">'+esc(T("submit"))+'</button>';
  }
  html+='</div>'+drawNav(Q)+'</div><p class="hint">'+esc(T("keys"))+'</p>';
  V.innerHTML=html;
  V.querySelectorAll(".opt").forEach(function(b){ b.onclick=function(){ answer(+b.getAttribute("data-k")); }; });
  var nb=document.getElementById("nextBtn"); if(nb) nb.onclick=function(){ goTo(Q.i+1); };
  var pb=document.getElementById("prevBtn"); if(pb) pb.onclick=function(){ goTo(Q.i-1); };
  var fb=document.getElementById("finBtn"); if(fb) fb.onclick=function(){ if(answered<n && !confirm(T("confirm_finish")(answered,n))) return; finishQuiz(); };
  var sbb=document.getElementById("subBtn"); if(sbb) sbb.onclick=function(){ if(confirm(T("confirm_submit")(answered,n))) submitExam(); };
  V.querySelectorAll("[data-d]").forEach(function(b){ b.onclick=function(){ goTo(+b.getAttribute("data-d")); }; });
  var nt=document.getElementById("navTog"); if(nt) nt.onclick=function(){ Q.nav=!Q.nav; drawQuiz(); if(Q.nav){ var c=V.querySelector(".dots .cur"); if(c) c.scrollIntoView({block:"nearest"}); } };
  var gn=document.getElementById("goN"); if(gn) gn.addEventListener("keydown",function(e){ if(e.key==="Enter"){ var v=parseInt(gn.value,10); if(v>=1&&v<=n) goTo(v-1); } });
  if(gn) gn.addEventListener("change",function(){ var v=parseInt(gn.value,10); if(v>=1&&v<=n) goTo(v-1); });
  document.getElementById("bmBtn").onclick=function(){
    var b=DB.bookmarks(); if(b[q.i]!==undefined){ delete b[q.i]; toast(T("unsaved")); } else { b[q.i]=q.cat; toast(T("saved")); }
    lset("bookmarks",b); cloudDataSoon(); drawQuiz();
  };
  var im=document.getElementById("qimg"); if(im) im.onclick=function(){ var l=document.createElement("div"); l.className="lb"; l.innerHTML='<img src="'+im.src+'" alt="">'; l.onclick=function(){ l.remove(); }; document.body.appendChild(l); };
}
function answer(k){
  var Q=S.quiz; if(!Q||Q.finished) return;
  var it=Q.items[Q.i], orig=it.order[k];
  if(Q.mode==="exam"){ Q.answers[Q.i]=orig; saveQuizProgress(); drawQuiz(); return; }
  if(Q.answers[Q.i]!==undefined) return;
  Q.answers[Q.i]=orig;
  wrongRecord(it.q.i, orig===it.q.c); streakRecord(1);
  saveQuizProgress(); drawQuiz();
}
function next(){
  var Q=S.quiz; if(!Q) return;
  if(Q.i+1<Q.items.length){ goTo(Q.i+1); return; }
  if(Q.mode==="learning" && Q.answers[Q.i]!==undefined) finishQuiz();
}
function buildRecords(Q,onlyAnswered){
  var out=[];
  Q.items.forEach(function(it,idx){
    var a=Q.answers[idx];
    if(a===undefined && onlyAnswered) return;
    out.push({ q:it.q, order:it.order, sel:(a===undefined?null:it.order.indexOf(a)), correct:it.correct });
  });
  return out;
}
function submitExam(){
  var Q=S.quiz; if(!Q||Q.finished) return;
  Q.records=buildRecords(Q,false);
  Q.records.forEach(function(r){ if(r.sel!==null) wrongRecord(r.q.i, r.sel===r.correct); });
  var answered=answeredCount(Q);
  if(answered) streakRecord(answered);
  finishQuiz();
}
function finishQuiz(){
  var Q=S.quiz; if(!Q||Q.finished) return;
  stopTimer(); Q.finished=true;
  if(Q.mode==="learning") Q.records=buildRecords(Q,true);
  var score=Q.records.filter(function(r){ return r.sel===r.correct; }).length;
  var total=Q.mode==="exam" ? Q.items.length : Q.records.length;
  var att={ id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()), categoryId:Q.catId, categoryTitle:Q.title, licenseTitle:Q.licTitle,
    mode:Q.mode, score:score, total:total, finishedAt:new Date().toISOString(),
    incorrect:Q.records.filter(function(r){ return r.sel!==r.correct; }).map(function(r){ return r.q.i; }) };
  if(total>0){ var all=DB.attempts(); all.unshift(att); lset("attempts",all); cloudUploadAttempt(att); }
  if(!Q.adhoc) progressDelete(Q.catId,Q.mode);
  S.lastResult={ att:att, records:Q.records, catId:Q.catId, mode:Q.mode, adhoc:Q.adhoc };
  S.quiz=null;
  location.replace("#/result");
}
document.addEventListener("keydown",function(e){
  var Q=S.quiz; if(!Q||Q.finished||location.hash.indexOf("#/quiz")!==0) return;
  if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  if(document.querySelector(".fbm.is-open")) return;
  var k=e.key.toLowerCase(), map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}, n=Q.items[Q.i].order.length;
  if(map[k]!==undefined && map[k]<n){ e.preventDefault(); answer(map[k]); }
  else if(e.key==="Enter"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); goTo(Q.i+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); goTo(Q.i-1); }
});

/* ================= RESULT ================= */
function wrongCard(r){
  var letters="ABCDEF", q=r.q, y=r.sel===null?T("none"):letters[r.sel]+") "+q.o[r.order[r.sel]], c=letters[r.correct]+") "+q.o[q.c];
  return '<div class="wrong"><p class="q">'+esc(q.t)+'</p>'+(q.m?'<img class="qimg" style="max-height:200px" src="'+DATA_BASE+'img/'+encodeURIComponent(q.m)+'" alt="" loading="lazy">':'')+
    '<p class="y">✗ '+esc(T("your"))+': '+esc(y)+'</p><p class="c">✓ '+esc(T("right"))+': '+esc(c)+'</p>'+(q.e?'<p class="e">'+esc(q.e)+'</p>':'')+'</div>';
}
function viewResult(){
  var R=S.lastResult; if(!R) return go("#/");
  setTop(T("res_t"),false);
  var a=R.att, p=pct(a.score,a.total), pass=p>=PASS, col=pass?"var(--ok)":(p>=60?"var(--warn)":"var(--bad)");
  var wrong=R.records.filter(function(r){ return r.sel!==r.correct; });
  var html='<div class="card res"><h1 style="font-size:1.4rem">'+esc(a.categoryTitle)+'</h1>'+(a.licenseTitle?'<p style="margin:.2rem 0 0;color:var(--ink-3)">'+esc(a.licenseTitle)+'</p>':'')+
    '<div class="score" style="--p:'+p+';--c:'+col+'"><div><b>'+p+'%</b><span>'+esc(T("score_of")(a.score,a.total))+'</span></div></div>'+
    (R.mode==="exam"?'<span class="pill '+(pass?'ok':'bad')+'">'+esc(pass?T("passed"):T("failed"))+'</span>':'')+
    '<div class="qnav" style="justify-content:center">'+
      (R.adhoc?'':'<a class="btn btn--gold" href="#/quiz/'+R.catId+'/'+R.mode+'" id="againBtn">'+esc(T("again"))+'</a><a class="btn btn--ghost" href="#/cat/'+R.catId+'">'+esc(T("to_subj"))+'</a>')+
      '<a class="btn btn--ghost" href="#/">'+esc(T("home"))+'</a></div></div>';
  html+='<div class="sec-h">'+esc(T("mistakes"))+' ('+wrong.length+')</div>';
  html+= wrong.length ? '<div class="list">'+wrong.map(wrongCard).join("")+'</div>' : '<div class="card" style="text-align:center">'+esc(T("nomist"))+'</div>';
  render(html);
}

/* ================= HISTORY ================= */
function viewHistory(filterCat){
  var all=DB.attempts(), list=filterCat? all.filter(function(a){ return a.categoryId===filterCat; }) : all;
  var title = filterCat ? (S.catMap[filterCat]?S.catMap[filterCat].meta.title:T("hist_t")) : T("hist_t");
  setTop(title,true);
  if(!list.length){ render('<div class="empty">'+ic("hist")+'<h3>'+esc(T("hist_empty"))+'</h3><p>'+esc(T("hist_empty_p"))+'</p></div>'); return; }
  var avg=Math.round(list.reduce(function(s,a){ return s+pct(a.score,a.total); },0)/list.length);
  var passes=list.filter(function(a){ return a.mode==="exam" && pct(a.score,a.total)>=PASS; }).length;
  var html='<div class="pagehead"><h1>'+esc(title)+'</h1></div><div class="stats"><div class="stat"><b>'+list.length+'</b><span>'+esc(T("attempts"))+'</span></div><div class="stat"><b>'+avg+' %</b><span>'+esc(T("avg"))+'</span></div><div class="stat"><b>'+passes+'</b><span>'+esc(T("passes"))+'</span></div></div><div class="list">';
  list.forEach(function(a){

  function apply(){
    L = (document.documentElement.lang==='en') ? 'en' : 'cs';
    box.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=T[L][el.getAttribute('data-t')]; });
    ta.placeholder=T[L].ph; em.placeholder=T[L].em; q('.fbm__x').setAttribute('aria-label',T[L].close);
  }
  function open(e){
    if(e) e.preventDefault();
    lastFocus=document.activeElement; apply();
    q('.fbm__form').hidden=false; q('.fbm__ok').hidden=true; msg.textContent='';
    box.classList.add('is-open'); document.documentElement.style.overflow='hidden';
    setTimeout(function(){ta.focus();},60);
  }
  function close(){
    box.classList.remove('is-open'); document.documentElement.style.overflow='';
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  box.addEventListener('click',function(e){ if(e.target===box) close(); });
  q('.fbm__x').addEventListener('click',close);
  q('.fbm__close').addEventListener('click',close);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&box.classList.contains('is-open')) close(); });
  document.addEventListener('click',function(e){
    var t=e.target.closest && e.target.closest('[data-feedback]'); if(t) open(e);
  });

  send.addEventListener('click',function(){
    var text=ta.value.trim();
    if(text.length<2){ msg.textContent=T[L].empty; ta.focus(); return; }
    if(hp.checked) return;
    send.disabled=true; send.textContent=T[L].sending; msg.textContent='';
    var page=location.pathname.split('/').pop()||'index.html';
    fetch('https://api.web3forms.com/submit',{
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        access_key:ACCESS_KEY,
        subject:'Feedback z webu propiloty.cz ('+page+')',
        from_name:'Propilot(y) feedback',
        message:text,
        email:em.value.trim()||undefined,
        stranka:page, jazyk:L
      })
    }).then(function(r){return r.json();}).then(function(d){
      if(d && d.success){ ta.value=''; em.value=''; q('.fbm__form').hidden=true; q('.fbm__ok').hidden=false; q('.fbm__close').focus(); }
      else { msg.textContent=T[L].err; }
    }).catch(function(){ msg.textContent=T[L].err; })
    .finally(function(){ send.disabled=false; send.textContent=T[L].send; });
  });
})();
</script></body>
</html>
